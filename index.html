<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>

  <style>
    body { font-family: Arial; background:#f5f5f5; margin:0; }
    .container { max-width:900px; margin:auto; padding:20px; }
    h1 { text-align:center; }

    .card { background:white; padding:15px; margin:10px 0; border-radius:10px; }
    input, select, button { padding:10px; margin:5px 0; width:100%; }
    button { background:#007bff; color:white; border:none; cursor:pointer; }
    button:hover { background:#0056b3; }

    .row { display:flex; gap:10px; }
    .row > * { flex:1; }

    table { width:100%; border-collapse:collapse; }
    th, td { padding:10px; border-bottom:1px solid #ddd; text-align:left; }

    .tabs { display:flex; gap:10px; margin-bottom:10px; }
    .tabs button { flex:1; }
  </style>
</head>
<body>

<div class="container">
  <h1>Expense Tracker</h1>

  <!-- AUTH -->
  <div class="card">
    <button onclick="login()">Login with Google</button>
    <button onclick="logout()">Logout</button>
    <p id="userInfo">Not logged in</p>
  </div>

  <div class="tabs">
    <button onclick="showTab('add')">Add Expense</button>
    <button onclick="showTab('summary')">Summary</button>
  </div>

  <!-- ADD EXPENSE -->
  <div id="add" class="card">
    <h3>Add Expense</h3>
    <input type="date" id="date">
    <input type="number" id="amount" placeholder="Amount">
    <select id="category"></select>
    <input type="text" id="newCategory" placeholder="Add new category">
    <button onclick="addCategory()">Add Category</button>
    <button onclick="addExpense()">Save Expense</button>
  </div>

  <!-- SUMMARY -->
  <div id="summary" class="card" style="display:none;">
    <h3>Summary</h3>
    <div class="row">
      <input type="date" id="startDate">
      <input type="date" id="endDate">
    </div>
    <button onclick="loadSummary()">Load Summary</button>

    <table>
      <thead>
        <tr><th>Category</th><th>Total</th></tr>
      </thead>
      <tbody id="summaryTable"></tbody>
    </table>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script>
  // 🔹 REPLACE WITH YOUR CONFIG
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  const categorySelect = document.getElementById('category');

  function showTab(tab) {
    document.getElementById('add').style.display = tab === 'add' ? 'block':'none';
    document.getElementById('summary').style.display = tab === 'summary' ? 'block':'none';
  }

  // AUTH
  function login() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider);
  }

  function logout() {
    auth.signOut();
  }

  auth.onAuthStateChanged(user => {
    if (user) {
      document.getElementById('userInfo').innerText = "Logged in as " + user.email;
      loadCategories();
    } else {
      document.getElementById('userInfo').innerText = "Not logged in";
      categorySelect.innerHTML = '';
    }
  });

  async function loadCategories() {
    if (!auth.currentUser) return;

    categorySelect.innerHTML = '';
    const snapshot = await db.collection('categories')
      .where("user", "==", auth.currentUser.uid)
      .get();

    snapshot.forEach(doc => {
      const opt = document.createElement('option');
      opt.value = doc.data().name;
      opt.textContent = doc.data().name;
      categorySelect.appendChild(opt);
    });
  }

  async function addCategory() {
    if (!auth.currentUser) return alert("Please login first");

    const name = document.getElementById('newCategory').value;
    if (!name) return;

    await db.collection('categories').add({
      name,
      user: auth.currentUser.uid
    });

    document.getElementById('newCategory').value = '';
    loadCategories();
  }

  async function addExpense() {
    if (!auth.currentUser) return alert("Please login first");

    const date = document.getElementById('date').value;
    const amount = parseFloat(document.getElementById('amount').value);
    const category = categorySelect.value;

    if (!date || !amount || !category) return alert('Fill all fields');

    await db.collection('expenses').add({
      date,
      amount,
      category,
      user: auth.currentUser.uid
    });

    alert('Saved!');
  }

  async function loadSummary() {
    if (!auth.currentUser) return alert("Please login first");

    const start = document.getElementById('startDate').value;
    const end = document.getElementById('endDate').value;

    const snapshot = await db.collection('expenses')
      .where("user", "==", auth.currentUser.uid)
      .get();

    let summary = {};

    snapshot.forEach(doc => {
      const e = doc.data();
      if ((!start || e.date >= start) && (!end || e.date <= end)) {
        summary[e.category] = (summary[e.category] || 0) + e.amount;
      }
    });

    const table = document.getElementById('summaryTable');
    table.innerHTML = '';

    Object.keys(summary).forEach(cat => {
      const row = `<tr><td>${cat}</td><td>${summary[cat]}</td></tr>`;
      table.innerHTML += row;
    });
  }

  function setDefaultDates() {
    const today = new Date();
    const first = new Date(today.setDate(today.getDate() - today.getDay()));

    document.getElementById('startDate').value = first.toISOString().split('T')[0];
    document.getElementById('endDate').value = new Date().toISOString().split('T')[0];
  }

  setDefaultDates();
</script>

</body>
</html>
