<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  font-family: 'Inter', Arial, sans-serif;
  background: linear-gradient(120deg, #e0e7ff 0%, #f5f5f5 100%);
  margin: 0;
}

.container {
  max-width: 900px;
  margin: 40px auto;
  padding: 30px;
  background: #fff;
  border-radius: 18px;
}

.card {
  background: #f8fafc;
  padding: 20px;
  margin: 15px 0;
  border-radius: 12px;
}

button {
  padding: 10px;
  width: 100%;
  border-radius: 8px;
  border: none;
  background: #6366f1;
  color: white;
  cursor: pointer;
}

.tabs {
  display: flex;
  gap: 10px;
}

.tabs button.active {
  background: #4338ca;
}

/* CALENDAR */
#calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  margin-bottom: 10px;
}

.calendar-day {
  padding: 10px;
  text-align: center;
  border-radius: 8px;
  cursor: pointer;
  background: #f1f5f9;
}

.calendar-day:hover {
  background: #c7d2fe;
}

.calendar-day.selected {
  background: #6366f1;
  color: white;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>Expense Tracker</h1>

<div id="notification"></div>

<!-- AUTH -->
<div class="card">
  <button onclick="login()">Login</button>
  <button onclick="logout()">Logout</button>
  <p id="userInfo">Not logged in</p>
</div>

<div class="tabs">
  <button id="tabAdd" onclick="showTab('add')" class="active">Add Expense</button>
  <button id="tabSummary" onclick="showTab('summary')">Summary</button>
</div>

<!-- ADD -->
<div id="add" class="card">

<h3>Select Date</h3>

<div id="calendar"></div>

<p><strong>Selected:</strong> <span id="selectedDate"></span></p>

<div id="dayExpenses" style="display:none;">
  <h4>Expenses</h4>
  <ul id="expenseList"></ul>
</div>

<input type="number" id="amount" placeholder="Amount">

<select id="category">
  <option value="">Select category</option>
</select>

<button onclick="addExpense()">Save Expense</button>

<input type="text" id="newCategory" placeholder="New category">
<button onclick="addCategory()">Add Category</button>

</div>

<!-- SUMMARY -->
<div id="summary" class="card" style="display:none;">
  <h3>Summary</h3>

  <input type="date" id="startDate">
  <input type="date" id="endDate">

  <button onclick="loadSummary()">Load Summary</button>

  <canvas id="summaryChart"></canvas>

  <table>
    <tbody id="summaryTable"></tbody>
  </table>
</div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyC6mZQ9ldWreLhqzssZxnINxvc2gJ8cV9Q",
    authDomain: "expense-tracker-d754a.firebaseapp.com",
    projectId: "expense-tracker-d754a",
    storageBucket: "expense-tracker-d754a.firebasestorage.app",
    messagingSenderId: "702098345018",
    appId: "1:702098345018:web:d39b173495ecb035a9f903",
    measurementId: "G-89Z2J5EW11"

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let selectedDate = null;
let summaryChart = null;

function showTab(tab) {
  document.getElementById('add').style.display = tab === 'add' ? 'block':'none';
  document.getElementById('summary').style.display = tab === 'summary' ? 'block':'none';
}

/* AUTH */
function login() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider);
}

function logout() {
  auth.signOut();
}

auth.onAuthStateChanged(user => {
  document.getElementById('userInfo').textContent = user ? user.email : "Not logged in";
  if (user) loadCategories();
});

/* CALENDAR */
function generateCalendar() {
  const calendar = document.getElementById('calendar');
  calendar.innerHTML = '';

  const today = new Date();
  const y = today.getFullYear();
  const m = today.getMonth();

  const firstDay = new Date(y, m, 1).getDay();
  const total = new Date(y, m + 1, 0).getDate();

  for (let i = 0; i < firstDay; i++) {
    calendar.appendChild(document.createElement('div'));
  }

  for (let d = 1; d <= total; d++) {
    const div = document.createElement('div');
    div.className = 'calendar-day';
    div.textContent = d;

    div.onclick = () => selectDate(y, m, d, div);

    calendar.appendChild(div);
  }
}

function selectDate(y, m, d, el) {
  document.querySelectorAll('.calendar-day').forEach(x => x.classList.remove('selected'));
  el.classList.add('selected');

  selectedDate = new Date(y, m, d).toISOString().split('T')[0];
  document.getElementById('selectedDate').textContent = selectedDate;

  loadExpensesForDate(selectedDate);
}

/* CATEGORY */
async function loadCategories() {
  const snapshot = await db.collection('categories')
    .where("user","==",auth.currentUser.uid).get();

  const select = document.getElementById('category');
  select.innerHTML = '<option value="">Select</option>';

  snapshot.forEach(doc => {
    const opt = document.createElement('option');
    opt.value = doc.data().name;
    opt.textContent = doc.data().name;
    select.appendChild(opt);
  });
}

async function addCategory() {
  const name = document.getElementById('newCategory').value;
  await db.collection('categories').add({
    name, user: auth.currentUser.uid
  });
  loadCategories();
}

/* EXPENSE */
async function addExpense() {
  const amount = parseFloat(document.getElementById('amount').value);
  const category = document.getElementById('category').value;

  if (!selectedDate || !amount || !category) {
    alert("Fill all fields");
    return;
  }

  await db.collection('expenses').add({
    date: selectedDate,
    amount,
    category,
    user: auth.currentUser.uid
  });

  loadExpensesForDate(selectedDate);
}

/* LOAD DAY EXPENSES */
async function loadExpensesForDate(date) {
  const list = document.getElementById('expenseList');
  list.innerHTML = '';

  const snap = await db.collection('expenses')
    .where("user","==",auth.currentUser.uid)
    .where("date","==",date)
    .get();

  if (snap.empty) {
    document.getElementById('dayExpenses').style.display = 'none';
    return;
  }

  snap.forEach(doc => {
    const e = doc.data();
    const li = document.createElement('li');
    li.textContent = e.category + ": " + e.amount;
    list.appendChild(li);
  });

  document.getElementById('dayExpenses').style.display = 'block';
}

/* SUMMARY */
async function loadSummary() {
  const start = document.getElementById('startDate').value;
  const end = document.getElementById('endDate').value;

  const snap = await db.collection('expenses')
    .where("user","==",auth.currentUser.uid).get();

  let sum = {};

  snap.forEach(doc => {
    const e = doc.data();
    if ((!start || e.date>=start) && (!end || e.date<=end)) {
      sum[e.category] = (sum[e.category]||0)+e.amount;
    }
  });

  const table = document.getElementById('summaryTable');
  table.innerHTML = '';

  Object.keys(sum).forEach(cat => {
    const row = document.createElement('tr');
    row.innerHTML = `<td>${cat}</td><td>${sum[cat]}</td>`;
    table.appendChild(row);
  });

  if (summaryChart) summaryChart.destroy();

  summaryChart = new Chart(document.getElementById('summaryChart'), {
    type:'pie',
    data:{
      labels:Object.keys(sum),
      datasets:[{data:Object.values(sum)}]
    }
  });
}

/* INIT */
generateCalendar();
</script>

</body>
</html>
