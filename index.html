<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>

  <!-- Google Fonts for modern look -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', Arial, sans-serif;
      background: linear-gradient(120deg, #e0e7ff 0%, #f5f5f5 100%);
      margin: 0;
      min-height: 100vh;
    }
    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 30px 20px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    h1 {
      text-align: center;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 30px;
    }
    .card {
      background: #f8fafc;
      padding: 24px 18px;
      margin: 18px 0;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    input, select, button {
      padding: 12px;
      margin: 7px 0;
      width: 100%;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 1rem;
      transition: border 0.2s;
    }
    input:focus, select:focus {
      border: 1.5px solid #6366f1;
      outline: none;
    }
    button {
      background: linear-gradient(90deg, #6366f1 0%, #2563eb 100%);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 8px rgba(99,102,241,0.08);
      transition: background 0.2s;
    }
    button:hover {
      background: linear-gradient(90deg, #4338ca 0%, #1e40af 100%);
    }
    .row {
      display: flex;
      gap: 14px;
    }
    .row > * {
      flex: 1;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 18px;
    }
    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      font-size: 1rem;
    }
    th {
      background: #f1f5f9;
      font-weight: 600;
      color: #374151;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }
    .tabs button {
      flex: 1;
      background: #f1f5f9;
      color: #6366f1;
      border: 1px solid #c7d2fe;
      border-radius: 8px 8px 0 0;
      box-shadow: none;
      font-weight: 600;
      transition: background 0.2s, color 0.2s;
    }
    .tabs button.active, .tabs button:focus {
      background: #6366f1;
      color: #fff;
      border-bottom: 2px solid #6366f1;
    }
    @media (max-width: 600px) {
      .container { padding: 10px; }
      .card { padding: 12px 6px; }
      .row { flex-direction: column; gap: 0; }
    }
    #summaryChart { margin: 24px 0 0 0; max-width: 500px; display: block; }
    #loginError { color: #ef4444; font-size: 0.95em; margin-top: 8px; }
  </style>
</head>
<body>

<div class="container">
  <h1>Expense Tracker</h1>

  <!-- AUTH -->
  <div class="card">
    <button onclick="login()">Login with Google</button>
    <button onclick="logout()">Logout</button>
    <p id="userInfo">Not logged in</p>
    <div id="loginError"></div>
  </div>

  <div class="tabs">
    <button id="tabAdd" onclick="showTab('add')" class="active">Add Expense</button>
    <button id="tabSummary" onclick="showTab('summary')">Summary</button>
  </div>

  <!-- ADD EXPENSE -->
  <div id="add" class="card">
    <h3>Add Expense</h3>
    <input type="date" id="date">
    <input type="number" id="amount" placeholder="Amount">
    <select id="category"></select>
    <input type="text" id="newCategory" placeholder="Add new category">
    <button onclick="addCategory()">Add Category</button>
    <button onclick="addExpense()">Save Expense</button>
  </div>

  <!-- SUMMARY -->
  <div id="summary" class="card" style="display:none;">
    <h3>Summary</h3>
    <div class="row">
      <input type="date" id="startDate">
      <input type="date" id="endDate">
    </div>
    <button onclick="loadSummary()">Load Summary</button>
    <canvas id="summaryChart"></canvas>
    <table>
      <thead>
        <tr><th>Category</th><th>Total</th></tr>
      </thead>
      <tbody id="summaryTable"></tbody>
    </table>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
  // 🔹 REPLACE WITH YOUR CONFIG
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  const categorySelect = document.getElementById('category');

  function showTab(tab) {
    document.getElementById('add').style.display = tab === 'add' ? 'block':'none';
    document.getElementById('summary').style.display = tab === 'summary' ? 'block':'none';
    document.getElementById('tabAdd').classList.toggle('active', tab === 'add');
    document.getElementById('tabSummary').classList.toggle('active', tab === 'summary');
  }

  // AUTH
  function login() {
    const provider = new firebase.auth.GoogleAuthProvider();
    document.getElementById('loginError').innerText = '';
    auth.signInWithPopup(provider).catch(err => {
      document.getElementById('loginError').innerText = err.message || 'Login failed.';
    });
  }

  function logout() {
    auth.signOut();
  }

  auth.onAuthStateChanged(user => {
    if (user) {
      document.getElementById('userInfo').innerText = "Logged in as " + user.email;
      document.getElementById('loginError').innerText = '';
      loadCategories();
    } else {
      document.getElementById('userInfo').innerText = "Not logged in";
      categorySelect.innerHTML = '';
    }
  });

  async function loadCategories() {
    if (!auth.currentUser) return;

    categorySelect.innerHTML = '';
    const snapshot = await db.collection('categories')
      .where("user", "==", auth.currentUser.uid)
      .get();

    snapshot.forEach(doc => {
      const opt = document.createElement('option');
      opt.value = doc.data().name;
      opt.textContent = doc.data().name;
      categorySelect.appendChild(opt);
    });
  }

  async function addCategory() {
    if (!auth.currentUser) return alert("Please login first");

    const name = document.getElementById('newCategory').value;
    if (!name) return;

    await db.collection('categories').add({
      name,
      user: auth.currentUser.uid
    });

    document.getElementById('newCategory').value = '';
    loadCategories();
  }

  async function addExpense() {
    if (!auth.currentUser) return alert("Please login first");

    const date = document.getElementById('date').value;
    const amount = parseFloat(document.getElementById('amount').value);
    const category = categorySelect.value;

    if (!date || !amount || !category) return alert('Fill all fields');

    await db.collection('expenses').add({
      date,
      amount,
      category,
      user: auth.currentUser.uid
    });

    alert('Saved!');
  }

  let summaryChart = null;
  async function loadSummary() {
    if (!auth.currentUser) return alert("Please login first");

    const start = document.getElementById('startDate').value;
    const end = document.getElementById('endDate').value;

    const snapshot = await db.collection('expenses')
      .where("user", "==", auth.currentUser.uid)
      .get();

    let summary = {};

    snapshot.forEach(doc => {
      const e = doc.data();
      if ((!start || e.date >= start) && (!end || e.date <= end)) {
        summary[e.category] = (summary[e.category] || 0) + e.amount;
      }
    });

    // Update table
    const table = document.getElementById('summaryTable');
    table.innerHTML = '';
    Object.keys(summary).forEach(cat => {
      const row = `<tr><td>${cat}</td><td>${summary[cat].toFixed(2)}</td></tr>`;
      table.innerHTML += row;
    });

    // Update chart
    const chartEl = document.getElementById('summaryChart');
    const categories = Object.keys(summary);
    const totals = categories.map(cat => summary[cat]);
    const colors = [
      '#6366f1','#f59e42','#10b981','#ef4444','#f472b6','#facc15','#38bdf8','#a3e635','#f87171','#818cf8','#fb7185','#34d399','#fbbf24','#60a5fa','#eab308'
    ];
    if (summaryChart) summaryChart.destroy();
    summaryChart = new Chart(chartEl, {
      type: 'pie',
      data: {
        labels: categories,
        datasets: [{
          data: totals,
          backgroundColor: colors.slice(0, categories.length),
        }]
      },
      options: {
        plugins: {
          legend: { position: 'bottom' },
          title: { display: true, text: 'Expenses by Category' }
        }
      }
    });
  }

  function setDefaultDates() {
    const today = new Date();
    const first = new Date(today.setDate(today.getDate() - today.getDay()));

    document.getElementById('startDate').value = first.toISOString().split('T')[0];
    document.getElementById('endDate').value = new Date().toISOString().split('T')[0];
  }

  setDefaultDates();
</script>

</body>
</html>
